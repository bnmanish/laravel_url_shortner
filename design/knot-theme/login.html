<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Knot</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="row g-0" style="min-height:100vh;">

  <div class="col-lg-5 d-flex align-items-center">
    <div class="w-100 px-4 px-md-5 py-5">
      <div class="auth-form-wrap">
        <a class="knot-logo mb-5 d-inline-flex" href="index.html">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="12.5" width="15" height="9" rx="4.5" transform="rotate(-38 3 12.5)" stroke="currentColor" stroke-width="2.3"/>
            <rect x="14" y="9.5" width="15" height="9" rx="4.5" transform="rotate(-38 14 9.5)" stroke="currentColor" stroke-width="2.3"/>
          </svg>
          Knot
        </a>
        <h2 class="mb-2">Welcome back.</h2>
        <p class="text-soft mb-4">Log in to see what people are clicking today.</p>

        <form onsubmit="return false;">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="you@company.com" required>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label">Password</label>
              <a href="#" class="text-rope" style="font-size:0.85rem;">Forgot?</a>
            </div>
            <input type="password" class="form-control" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label text-soft" for="remember">Keep me logged in</label>
          </div>
          <button type="submit" class="btn btn-ink w-100 mb-3">Log in</button>
          <button type="button" class="btn btn-outline-ink w-100">
            Continue with Google
          </button>
        </form>

        <p class="text-center text-soft mt-4 mb-0">New to Knot? <a href="signup.html" class="text-rope fw-semibold">Create an account</a></p>
      </div>
    </div>
  </div>

  <div class="col-lg-7 d-none d-lg-flex auth-side p-5" style="background: linear-gradient(135deg, var(--moss) 0%, #0A5F63 100%);">
    <div class="knot-logo" style="color:var(--paper);">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="12.5" width="15" height="9" rx="4.5" transform="rotate(-38 3 12.5)" stroke="currentColor" stroke-width="2.3"/>
        <rect x="14" y="9.5" width="15" height="9" rx="4.5" transform="rotate(-38 14 9.5)" stroke="currentColor" stroke-width="2.3"/>
      </svg>
    </div>

    <div>
      <p class="testimonial-quote mb-4" style="color:var(--paper);">We stopped guessing which channel drove signups. Knot just shows us — down to the referring post.</p>
      <p class="fw-semibold mb-0" style="color:var(--paper);">Priya Menon</p>
      <p style="color:#B9C2BC;">Head of Growth, Fernway</p>
    </div>

    <div class="d-flex gap-5" style="color:#B9C2BC;">
      <div><div class="stat-num" style="color:var(--paper); font-size:2.2rem;">2.4B</div><div style="font-size:0.85rem;">links shortened</div></div>
      <div><div class="stat-num" style="color:var(--paper); font-size:2.2rem;">99.99%</div><div style="font-size:0.85rem;">uptime</div></div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
